<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBMS Lab Assignment 1</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>Crime Records Database</h1>
      <p>Crime Managemnent Portal</p>
    </header>


    <main>
      <section id="addSection" class="add-section">
        <h2 id="addHeader">Add Crime Record</h2>

        <form id="addForm" class="">
          <div class="form-group">
            <label for="addCrimeId">Crime ID</label>
            <input
              type="number"
              id="addCrimeId"
              name="crimeId"
              placeholder="Enter crime ID"
            />
          </div>

          <div class="form-group">
            <label for="addCrimeType">Crime Type</label>
            <input
              type="text"
              id="addCrimeType"
              name="crimeType"
              placeholder="Enter crime type"
            />
          </div>

          <div class="form-group">
            <label for="addReportDate">Report Date</label>
            <input type="date" id="addReportDate" name="reportDate" />
          </div>

          <div class="form-group">
            <label for="addCallDate">Call Date</label>
            <input type="date" id="addCallDate" name="callDate" />
          </div>

          <div class="form-group">
            <label for="addOffenseDate">Offense Date</label>
            <input type="date" id="addOffenseDate" name="offenseDate" />
          </div>

          <div class="form-group">
            <label for="addCallTime">Call Time</label>
            <input type="time" id="addCallTime" name="callTime" />
          </div>

          <div class="form-group">
            <label for="addDisposition">Disposition</label>
            <input
              type="text"
              id="addDisposition"
              name="disposition"
              placeholder="Enter disposition"
            />
          </div>

          <div class="form-group">
            <label for="addAddress">Address</label>
            <input
              type="text"
              id="addAddress"
              name="address"
              placeholder="Enter address"
            />
          </div>

          <div class="form-group">
            <label for="addCity">City</label>
            <input
              type="text"
              id="addCity"
              name="city"
              placeholder="Enter city"
            />
          </div>

          <div class="form-group">
            <label for="addState">State</label>
            <input
              type="text"
              id="addState"
              name="state"
              placeholder="Enter state"
            />
          </div>

          <div class="form-group">
            <label for="addAddressType">Address Type</label>
            <input
              type="text"
              id="addAddressType"
              name="addressType"
              placeholder="Enter address type"
            />
          </div>

          <div class="form-group">
            <label for="addStatus">Case Status</label>
            <input
              type="text"
              id="addStatus"
              name="status"
              placeholder="Enter case status"
            />
          </div>

          <button class="button" type="submit" id="submitButton">
            Add Record
          </button>
        </form>
      </section>

      <section class="search-section">
        <h2>Search Crime Records</h2>

        <form id="searchForm">
          <div class="form-group">
            <label for="crimeId">Crime ID</label>
            <input
              type="number"
              id="crimeId"
              name="crimeId"
              placeholder="Enter crime ID"
            />
          </div>

          <div class="form-group">
            <label for="crimeType">Crime Type</label>
            <input
              type="text"
              id="crimeType"
              name="crimeType"
              placeholder="Enter crime type"
            />
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city" />
          </div>

          <div class="form-group">
            <label for="disposition">Disposition</label>
            <input
              type="text"
              id="disposition"
              name="disposition"
              placeholder="Enter disposition"
            />
          </div>

          <div class="form-group">
            <label for="status">Case Status</label>
            <input
              type="text"
              id="status"
              name="status"
              placeholder="Enter case status"
            />
          </div>

          <button class="button" type="submit" id="searchButton">Search</button>
          <button class="button" type="reset" id="resetButton">Reset</button>
        </form>
      </section>

      <section class="table-section">
        <h2>Crime Records</h2>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Crime ID</th>
                <th>Crime Type</th>
                <th>Report Date</th>
                <th>Call Date</th>
                <th>Offense Date</th>
                <th>Call Time</th>
                <th>Disposition</th>
                <th>Address</th>
                <th>City</th>
                <th>State</th>
                <th>Address Type</th>
                <th>Case Status</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="crimeTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 Crime Records Database</p>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
